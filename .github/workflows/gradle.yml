# This workflow builds, tests, reports code coverage, and releases builds.
# It runs on pushes and PRs to main and development branches.

name: Build, Test & Coverage, Release

on:
  push:
    branches: [ "main", "development" ]
    tags:
      - 'v*.*.*'  # triggers release job for semantic versions (v1.0.0, v2.0.0, v2.1.3)
  pull_request:
    branches: [ "main", "development" ]

jobs:
  # Build universal JAR once (platform-independent)
  build:
    name: Build Universal JAR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Only fetch all tags when we're on a tag push, otherwise shallow clone
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/v') && 0 || 1 }}

      - name: Get version from tag or default
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}

            # Check if version already has -dev suffix
            if [[ "$VERSION" == *-dev ]]; then
              IS_PRERELEASE="true"
              echo "Development tag detected (contains -dev suffix)"
            else
              IS_PRERELEASE="false"
            fi
          else
            # Use local-SNAPSHOT for non-tag builds (consistent with build.gradle default)
            VERSION="local-SNAPSHOT"
            IS_PRERELEASE="true"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION} (prerelease: ${IS_PRERELEASE})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          cache-read-only: false
          cache-cleanup: always
          add-job-summary: on-failure
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"

      - name: Build JAR with version (includes Spotless check)
        run: |
          cd StumbleHome
          ./gradlew --stacktrace --no-daemon spotlessCheck build -x test -PprojectVersion=${{ steps.get_version.outputs.version }}

      # Upload universal JAR (works on all platforms)
      - name: Upload universal JAR
        uses: actions/upload-artifact@v4
        with:
          name: universal-jar
          path: StumbleHome/lib/build/libs/*.jar
          retention-days: 3

  # Test on all platforms to catch platform-specific issues
  test:
    name: Test on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        include:
          - os: ubuntu-latest
            run-coverage: true
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      # Skip Windows/macOS on regular pushes (still run on PRs and tags)
      - name: Checkout code
        if: matrix.os == 'ubuntu-latest' || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow clone - tests don't need git history

      - name: Set up JDK 17
        if: matrix.os == 'ubuntu-latest' || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: matrix.os == 'ubuntu-latest' || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          cache-read-only: true  # Use read-only cache since build job already populated it
          cache-cleanup: always
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"

      # Ubuntu: Run full tests with coverage
      - name: Run tests with coverage (Ubuntu)
        if: (matrix.os == 'ubuntu-latest' || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')) && matrix.run-coverage
        run: |
          cd StumbleHome
          ./gradlew --stacktrace --no-daemon test jacocoTestReport

      # Windows/macOS: Run tests only (no coverage to save time)
      - name: Run tests only (Windows)
        if: (matrix.os == 'ubuntu-latest' || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')) && runner.os == 'Windows' && !matrix.run-coverage
        run: |
          cd StumbleHome
          ./gradlew.bat --stacktrace --no-daemon test

      - name: Run tests only (macOS)
        if: (matrix.os == 'ubuntu-latest' || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')) && runner.os == 'macOS' && !matrix.run-coverage
        run: |
          cd StumbleHome
          ./gradlew --stacktrace --no-daemon test

      # Publish test results (only from Ubuntu to avoid duplicates)
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && (matrix.os == 'ubuntu-latest' || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')) && matrix.os == 'ubuntu-latest'
        with:
          files: |
            StumbleHome/lib/build/test-results/test/**/*.xml
          check_name: Test Results
          comment_mode: changes

      # Upload coverage report (only from Ubuntu)
      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        if: always() && (matrix.os == 'ubuntu-latest' || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')) && matrix.os == 'ubuntu-latest'
        with:
          name: jacoco-html-report
          path: StumbleHome/lib/build/reports/jacoco/test/html/
          retention-days: 3

      # Upload test reports (only from Ubuntu)
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always() && (matrix.os == 'ubuntu-latest' || github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')) && matrix.os == 'ubuntu-latest'
        with:
          name: test-reports
          path: StumbleHome/lib/build/reports/tests/test/
          retention-days: 3  # Reduced from 7 to save storage

  # Build macOS native app bundle
  build-macos-app:
    name: Build macOS App Bundle
    needs: build
    runs-on: macos-latest
    # Only build macOS app for production releases (exclude -dev tags)
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-dev')
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow clone - build doesn't need git history

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          cache-read-only: false  # macOS needs fresh build, not Ubuntu cache
          cache-cleanup: always
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"

      - name: Build macOS app bundle
        run: |
          cd StumbleHome
          ./gradlew --stacktrace packageMacM1

      - name: Extract macOS app and remove zip
        run: |
          cd StumbleHome/build/construo
          unzip -o stumblehome-macM1.zip -d .
          rm stumblehome-macM1.zip

      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: StumbleHome/build/construo
          retention-days: 7

  release:
    needs: [ build, test, build-macos-app ]
    runs-on: ubuntu-latest
    # Run if build and test succeed, even if build-macos-app was skipped
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.test.result == 'success' &&
      (needs.build-macos-app.result == 'success' || needs.build-macos-app.result == 'skipped') &&
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow clone - release only needs current commit

      # Download universal JAR (works on all platforms)
      - name: Download universal JAR
        uses: actions/download-artifact@v4
        with:
          name: universal-jar
          path: ./jar-build

      - name: Rename universal JAR with version
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          mv jar-build/StumbleHome-*.jar StumbleHome-${VERSION}.jar
          echo "Created StumbleHome-${VERSION}.jar"

      # Download macOS app bundle (if it was built)
      - name: Download macOS app bundle
        uses: actions/download-artifact@v4
        continue-on-error: true
        id: download-macos
        with:
          name: macos-app
          path: ./macos-app

      - name: Create macOS app zip with version
        if: steps.download-macos.outcome == 'success'
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          cd macos-app
          if [ -d "Stumble Home.app" ]; then
            zip -r ../StumbleHome-${VERSION}-macos-app.zip "Stumble Home.app"
            echo "Created StumbleHome-${VERSION}-macos-app.zip"
          else
            echo "Stumble Home.app not found, skipping macOS app packaging"
          fi

      - name: Generate release body
        id: release-body
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          IS_PRERELEASE="${{ needs.build.outputs.is_prerelease }}"

          BODY=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            BODY="## ⚠️ Pre-release (Development Build)

          This is a development pre-release and may be unstable. Use at your own risk.

          "
          fi

          BODY+="## Installation

          "

          if [ "$IS_PRERELEASE" = "true" ]; then
            BODY+="Run Stumble-Home through the JAR (requires Java >=17).

          **For all platforms (Windows, macOS, Linux):**
          - Download \`StumbleHome-${VERSION}.jar\`
          - Run: \`java -jar StumbleHome-${VERSION}.jar\`
          - macOS users: Add \`-XstartOnFirstThread\` flag: \`java -XstartOnFirstThread -jar StumbleHome-${VERSION}.jar\`"
          else
            BODY+="You can either run Stumble-Home through the JAR (requires Java >=17), or if applicable, use the native macOS app.

          **For all platforms (Windows, macOS, Linux):**
          - Download \`StumbleHome-${VERSION}.jar\`
          - Run: \`java -jar StumbleHome-${VERSION}.jar\`
          - macOS users: Add \`-XstartOnFirstThread\` flag: \`java -XstartOnFirstThread -jar StumbleHome-${VERSION}.jar\`

          **For macOS (native app):**
          - Download \`StumbleHome-${VERSION}-macos-app.zip\`
          - Extract and run \`Stumble Home.app\`"
          fi

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          files: |
            StumbleHome-${{ needs.build.outputs.version }}.jar
            StumbleHome-${{ needs.build.outputs.version }}-macos-app.zip
          body: ${{ steps.release-body.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
