# This workflow builds, tests, and reports code coverage for the Stumble-Home project
# It runs on pushes and PRs to main and development branches.

name: Build, Test & Coverage

on:
  push:
    branches: [ "main", "development" ]
    tags: ["v*"] # triggers release job
  pull_request:
    branches: [ "main", "development" ]

jobs:
  build-and-test:
    name: Build, Test & Coverage Report
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write         # Needed to create check runs for test results
      pull-requests: write  # Needed for test result comments

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          cache-read-only: false  # Allow cache writes from all branches

      - name: Run Spotless format check
        run: |
          cd StumbleHome
          ./gradlew --no-daemon --stacktrace spotlessCheck

      - name: Build with Gradle Wrapper (Unix)
        if: runner.os != 'Windows'
        run: |
          cd StumbleHome
          ./gradlew --no-daemon --stacktrace build jacocoTestReport

      - name: Build with Gradle Wrapper (Windows)
        if: runner.os == 'Windows'
        run: |
          cd StumbleHome
          ./gradlew.bat --no-daemon --stacktrace build jacocoTestReport

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        run: |
          cd StumbleHome
          ./gradlew --no-daemon --stacktrace packageMacM1

      - name: Extract macOS app and remove zip
        if: runner.os == 'macOS'
        run: |
          cd StumbleHome/build/construo
          unzip -o stumblehome-macM1.zip -d .
          rm stumblehome-macM1.zip

      - name: Upload macOS bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: StumbleHome/build/construo

      # Upload build artifacts (JAR file)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: StumbleHome-${{ matrix.os }}-jar
          path: StumbleHome/lib/build/libs/*.jar
          retention-days: 30

      # Upload test results for visibility even if tests fail
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            StumbleHome/lib/build/test-results/test/**/*.xml
          check_name: Test Results
          comment_mode: changes

      # Upload HTML coverage report for manual review
      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-html-report-${{ matrix.os }}
          path: StumbleHome/lib/build/reports/jacoco/test/html/
          retention-days: 30

      # Upload test reports
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: StumbleHome/lib/build/reports/tests/test/
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # only run on tags
    if: startsWith(github.ref, 'ref/tags/')

    steps:
      - uses: actions/checkout@v4

      # download JAR artifact for each OS created by matrix
      # Ubuntu
      - name: Download Ubuntu Build
        uses: actions/download-artifact@v4
        with:
          name: lib-ubuntu-latest.jar
          path: .

      - name: Rename Ubuntu Build
        run: mv StumbleHome-1.0.0.jar lib-ubuntu.jar

      # Windows
      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: lib-windows-latest.jar
          path: .

      - name: Rename Windows Build
        run: mv StumbleHome-1.0.0.jar lib-windows.jar

      # MacOS
      - name: Download MacOS Build
        uses: actions/download-artifact@v4
        with:
          name: lib-macos-latest.jar
          path: .

      - name: Rename MacOS Build
        run: mv StumbleHome-1.0.0.jar lib-macos.jar

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name  }} #e.g. v1.0.0
          files: |
            lib-ubuntu.jar
            lib-windows.jar
            lib-macos.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
