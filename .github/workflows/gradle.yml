# This workflow builds, tests, and reports code coverage for the Stumble-Home project
# It runs on pushes and PRs to main and development branches.

name: Build, Test & Coverage

on:
  push:
    branches: [ "main", "development" ]
    tags:
      - 'v*.*.*'  # triggers release job for semantic versions (v1.0.0, v2.0.0, v2.1.3)
  pull_request:
    branches: [ "main", "development" ]

jobs:
  # Build universal JAR once (platform-independent)
  build:
    name: Build Universal JAR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Get version from tag or default
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}

            # Check if version already has -dev suffix
            if [[ "$VERSION" == *-dev ]]; then
              IS_PRERELEASE="true"
              echo "Development tag detected (contains -dev suffix)"
            else
              IS_PRERELEASE="false"
            fi
          else
            VERSION="1.0.0-dev"
            IS_PRERELEASE="true"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION} (prerelease: ${IS_PRERELEASE})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true
          add-job-summary: on-failure

      - name: Build JAR with version (includes Spotless check)
        run: |
          cd StumbleHome
          ./gradlew --stacktrace spotlessCheck build -x test -PprojectVersion=${{ steps.get_version.outputs.version }}

      # Upload universal JAR (works on all platforms)
      - name: Upload universal JAR
        uses: actions/upload-artifact@v4
        with:
          name: universal-jar
          path: StumbleHome/lib/build/libs/*.jar
          retention-days: 30

  # Test on all platforms to catch platform-specific issues
  test:
    name: Test on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        include:
          - os: ubuntu-latest
            run-coverage: true
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      # Skip Windows/macOS on regular pushes (still run on PRs and tags)
      - name: Check if should run
        id: should-run
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]] || [[ "${{ github.event_name }}" == "pull_request" ]] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Running tests on ${{ matrix.os }}"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Skipping tests on ${{ matrix.os }} for regular push"
          fi

      - name: Checkout code
        if: steps.should-run.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: steps.should-run.outputs.should_run == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.should-run.outputs.should_run == 'true'
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      # Ubuntu: Run full tests with coverage
      - name: Run tests with coverage (Ubuntu)
        if: steps.should-run.outputs.should_run == 'true' && matrix.run-coverage
        run: |
          cd StumbleHome
          ./gradlew --stacktrace test jacocoTestReport

      # Windows/macOS: Run tests only (no coverage to save time)
      - name: Run tests only (Windows)
        if: steps.should-run.outputs.should_run == 'true' && runner.os == 'Windows' && !matrix.run-coverage
        run: |
          cd StumbleHome
          ./gradlew.bat --stacktrace test

      - name: Run tests only (macOS)
        if: steps.should-run.outputs.should_run == 'true' && runner.os == 'macOS' && !matrix.run-coverage
        run: |
          cd StumbleHome
          ./gradlew --stacktrace test

      # Publish test results (only from Ubuntu to avoid duplicates)
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && steps.should-run.outputs.should_run == 'true' && matrix.os == 'ubuntu-latest'
        with:
          files: |
            StumbleHome/lib/build/test-results/test/**/*.xml
          check_name: Test Results
          comment_mode: changes

      # Upload coverage report (only from Ubuntu)
      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        if: always() && steps.should-run.outputs.should_run == 'true' && matrix.os == 'ubuntu-latest'
        with:
          name: jacoco-html-report
          path: StumbleHome/lib/build/reports/jacoco/test/html/
          retention-days: 30

      # Upload test reports (only from Ubuntu)
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always() && steps.should-run.outputs.should_run == 'true' && matrix.os == 'ubuntu-latest'
        with:
          name: test-reports
          path: StumbleHome/lib/build/reports/tests/test/
          retention-days: 30

  # Build macOS native app bundle
  build-macos-app:
    name: Build macOS App Bundle
    needs: build
    runs-on: macos-latest
    # Only build macOS app for releases (tags) to save resources on PR/push builds
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Build macOS app bundle
        run: |
          cd StumbleHome
          ./gradlew --stacktrace packageMacM1

      - name: Extract macOS app and remove zip
        run: |
          cd StumbleHome/build/construo
          unzip -o stumblehome-macM1.zip -d .
          rm stumblehome-macM1.zip

      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: StumbleHome/build/construo
          retention-days: 30

  release:
    needs: [build, test, build-macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only run on semantic version tags (e.g., v1.0.0, v2.0.0, v3.5.2, etc.)
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      # Download universal JAR (works on all platforms)
      - name: Download universal JAR
        uses: actions/download-artifact@v4
        with:
          name: universal-jar
          path: ./jar-build

      - name: Rename universal JAR with version
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          mv jar-build/StumbleHome-*.jar StumbleHome-${VERSION}.jar
          echo "Created StumbleHome-${VERSION}.jar"

      # Download macOS app bundle (if it was built)
      - name: Download macOS app bundle
        uses: actions/download-artifact@v4
        continue-on-error: true
        id: download-macos
        with:
          name: macos-app
          path: ./macos-app

      - name: Create macOS app zip with version
        if: steps.download-macos.outcome == 'success'
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          cd macos-app
          if [ -d "stumblehome.app" ]; then
            zip -r ../StumbleHome-${VERSION}-macos-app.zip stumblehome.app
            echo "Created StumbleHome-${VERSION}-macos-app.zip"
          else
            echo "stumblehome.app not found, skipping macOS app packaging"
          fi

      - name: Prepare release files list
        id: release-files
        run: |
          FILES="StumbleHome-${{ needs.build.outputs.version }}.jar"
          if [ -f "StumbleHome-${{ needs.build.outputs.version }}-macos-app.zip" ]; then
            FILES="${FILES}\nStumbleHome-${{ needs.build.outputs.version }}-macos-app.zip"
            echo "Including macOS app in release"
          else
            echo "macOS app not found, releasing JAR only"
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo -e "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate release body
        id: release-body
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          IS_PRERELEASE="${{ needs.build.outputs.is_prerelease }}"

          BODY=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            BODY="## ⚠️ Pre-release (Development Build)

          This is a development pre-release and may be unstable. Use at your own risk.

          "
          fi

          BODY+="## Installation

          You can either run Stumble-Home through the JAR (requires Java >=17), or if applicable, use the native macOS app.

          **For all platforms (Windows, macOS, Linux):**
          - Download \`StumbleHome-${VERSION}.jar\`
          - Run: \`java -jar StumbleHome-${VERSION}.jar\`
          - macOS users: Add \`-XstartOnFirstThread\` flag: \`java -XstartOnFirstThread -jar StumbleHome-${VERSION}.jar\`

          **For macOS (native app):**
          - Download \`StumbleHome-${VERSION}-macos-app.zip\`
          - Extract and run \`stumblehome.app\`"

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          files: ${{ steps.release-files.outputs.files }}
          body: ${{ steps.release-body.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
