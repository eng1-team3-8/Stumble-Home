plugins {
  id 'java-library'
  id 'idea'
  id 'eclipse'
}

group = 'io.github.stumblehome'
version = project.findProperty('projectVersion') ?: '1.0.0'
ext.appName = 'Maze-game'

java {
  sourceCompatibility = JavaVersion.VERSION_1_8
  targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
  mavenCentral()
  mavenLocal()
  maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
  maven { url 'https://jitpack.io' }
}

dependencies {
  implementation "com.badlogicgames.gdx:gdx:${project.findProperty('gdxVersion') ?: '1.13.1'}"
}

// Keep IDEA/Eclipse output settings similar to previous layout
idea.module.outputDir = file('build/classes/java/main')
idea.module.testOutputDir = file('build/classes/java/test')

// Generate assets list into project root assets/assets.txt (keeps existing behavior)
tasks.register('generateAssetList') {
  // Assets are located under this module at src/main/assets
  inputs.dir('src/main/assets')
  File assetsFolder = new File(project.projectDir, 'src/main/assets')
  File assetsFile = new File(assetsFolder, 'assets.txt')
  doLast {
    assetsFile.delete()
    fileTree(assetsFolder).collect { assetsFolder.relativePath(it) }.sort().each {
      assetsFile.append(it + "\n")
    }
  }
}

processResources.dependsOn 'generateAssetList'

// Create an executable fat JAR for convenience (includes runtime dependencies).
jar {
  // name the jar after the project/app rather than 'lib'
  archiveBaseName.set('StumbleHome')
  archiveVersion.set(project.version.toString())

  // Avoid duplicate entries when unpacking dependency jars
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE

  // Include runtime dependencies into the jar (fat/uber jar)
  from {
    configurations.runtimeClasspath.findAll { it.exists() }.collect { it.isDirectory() ? it : zipTree(it) }
  } {
    // exclude signature and manifest files from dependency jars so our manifest remains
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/MANIFEST.MF'
  }

  // Minimal manifest to allow 'java -jar' if the runtime environment is suitable
  manifest {
    attributes(
      'Main-Class': 'io.github.stumblehome.LauncherStub',
      'Enable-Native-Access': 'ALL-UNNAMED'
    )
  }

  doLast {
    // mark the jar executable (best-effort)
    def jarFile = archiveFile.get().asFile
    if (jarFile.exists()) jarFile.setExecutable(true, false)
  }
}
